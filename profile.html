<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atinara | Perfil predictivo</title>
  <meta name="description" content="Consulta el currículum predictivo público, el historial resuelto y los logros de una cuenta de Atinara.">
  <meta name="application-name" content="Atinara">
  <meta property="og:site_name" content="Atinara">
  <meta property="og:title" content="Atinara | Perfil predictivo">
  <meta property="og:description" content="Consulta el currículum predictivo público, el historial resuelto y los logros de una cuenta de Atinara.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
  <script src="theme.js?v=20260804-radar1"></script>
  <link rel="stylesheet" href="styles.css?v=20260804-radar1">
  <script src="observability-config.js?v=20260804-radar1"></script>
  <script src="monitoring.js?v=20260804-radar1"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar" aria-label="Cabecera principal">
      <a class="brand" href="index.html" aria-label="Atinara inicio">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Atinara</span>
      </a>

      <nav class="primary-navigation" data-primary-navigation aria-label="Navegación principal"></nav>

      <nav class="topbar-actions detail-user-state" aria-label="Cuenta y estado del usuario">
        <output class="karma-pill" aria-label="Karma disponible" data-auth-private hidden>
          <span class="karma-symbol" aria-hidden="true">K</span>
          <strong data-profile-karma>—</strong>
        </output>
        <span class="user-stat-pill" data-auth-private hidden>Prestigio: <strong data-profile-prestige>—</strong></span>
        <span class="user-stat-pill" data-auth-private hidden>Rango: <strong data-profile-rank>—</strong></span>
        <button class="profile-button" type="button" data-auth-open data-auth-state="guest" data-profile-username aria-label="Entrar en Atinara">Entrar</button>
        <button class="profile-button" type="button" data-auth-state="user" data-profile-username hidden aria-label="Usuario @Usuario">@Usuario</button>
        <button class="logout-button" type="button" data-auth-signout data-auth-state="user" hidden>Salir</button>
      </nav>
    </header>

    <main class="profile-page">
      <section id="profile-root" aria-live="polite">
        <div class="profile-loading-card">
          <span class="profile-loading-mark" aria-hidden="true"></span>
          <p class="eyebrow">Currículum predictivo</p>
          <h1>Cargando perfil...</h1>
          <p>Calculando estadísticas reales desde las predicciones resueltas.</p>
        </div>
      </section>
    </main>
  </div>

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"
    integrity="sha384-fPWur1rx/DE6YtXP/x0MD6dd90RgnVsz5yX/DIg7CcVAnTBZsENWuIcpvVTM39ti"
    crossorigin="anonymous"
  ></script>
  <script src="supabaseClient.js?v=20260804-radar1"></script>
  <script src="password-security.js?v=20260804-radar1"></script>
  <script src="password-recovery.js?v=20260804-radar1"></script>
  <script src="site-ui.js?v=20260804-radar1"></script>
  <script src="auth.js?v=20260804-radar1"></script>
  <script src="social.js?v=20260804-radar1"></script>
  <script src="profile.js?v=20260804-radar1"></script>
</body>
</html>
