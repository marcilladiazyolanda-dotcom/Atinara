<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Atinara | Detalle de mercado</title>
  <meta name="description" content="Consulta el detalle, los criterios y la resolución de un mercado de predicción de Atinara.">
  <meta name="application-name" content="Atinara">
  <meta property="og:site_name" content="Atinara">
  <meta property="og:title" content="Atinara | Detalle de mercado">
  <meta property="og:description" content="Consulta el detalle, los criterios y la resolución de un mercado de predicción de Atinara.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://marcilladiazyolanda-dotcom.github.io/Atinara/assets/brand/atinara-symbol.svg">
  <meta property="og:image:alt" content="Símbolo A3 de Atinara">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="assets/brand/favicon.svg" type="image/svg+xml">
  <script src="theme.js?v=20260825-radar-provider-checkpoint1"></script>
  <link rel="stylesheet" href="styles.css?v=20260825-radar-provider-checkpoint1">
  <script src="observability-config.js?v=20260825-radar-provider-checkpoint1"></script>
  <script src="monitoring.js?v=20260825-radar-provider-checkpoint1"></script>
</head>
<body>
  <div class="app-shell">
    <header class="topbar" aria-label="Cabecera principal">
      <a class="brand" href="index.html" aria-label="Atinara inicio">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">Atinara</span>
      </a>

      <nav class="primary-navigation" data-primary-navigation aria-label="Navegación principal"></nav>

      <nav class="topbar-actions detail-user-state" aria-label="Cuenta y estado del usuario">
        <output class="karma-pill" aria-label="Karma disponible" data-auth-private hidden>
          <span class="karma-symbol" aria-hidden="true">K</span>
          <strong data-profile-karma>—</strong>
        </output>
        <span class="user-stat-pill" data-auth-private hidden>Prestigio: <strong data-profile-prestige>—</strong></span>
        <span class="user-stat-pill" data-auth-private hidden>Rango: <strong data-profile-rank>—</strong></span>
        <button class="profile-button" type="button" data-auth-open data-auth-state="guest" data-profile-username aria-label="Entrar en Atinara">Entrar</button>
        <button class="profile-button" type="button" data-auth-state="user" data-profile-username hidden aria-label="Usuario @Usuario">@Usuario</button>
        <button class="logout-button" type="button" data-auth-signout data-auth-state="user" hidden>Salir</button>
      </nav>
    </header>

    <main class="detail-page">
      <div id="market-detail-root" aria-live="polite"></div>
      <section id="market-comments-section" class="market-comments-section" aria-labelledby="market-comments-title" hidden>
        <div id="market-comments-root"></div>
      </section>
    </main>
  </div>

  <dialog class="modal-backdrop" id="prediction-modal" aria-labelledby="prediction-modal-title" aria-describedby="prediction-modal-description">
    <section class="modal prediction-modal">
      <button class="modal-close" id="prediction-modal-close" type="button" aria-label="Cerrar modal">×</button>
      <p class="eyebrow">Confirmación</p>
      <div class="modal-check" id="prediction-modal-check" hidden aria-hidden="true">✓</div>
      <h2 id="prediction-modal-title">Predicción</h2>
      <div id="prediction-modal-description" class="modal-summary"></div>
      <p class="prototype-warning">Karma ficticio, sin dinero real.</p>
      <div class="modal-actions">
        <a class="primary-button" id="prediction-modal-primary" href="my-predictions.html" hidden>Ver mis predicciones</a>
        <button class="secondary-button" id="prediction-modal-ok" type="button">Cerrar</button>
      </div>
    </section>
  </dialog>

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.111.0"
    integrity="sha384-fPWur1rx/DE6YtXP/x0MD6dd90RgnVsz5yX/DIg7CcVAnTBZsENWuIcpvVTM39ti"
    crossorigin="anonymous"
  ></script>
  <script src="supabaseClient.js?v=20260825-radar-provider-checkpoint1"></script>
  <script src="password-security.js?v=20260825-radar-provider-checkpoint1"></script>
  <script src="password-recovery.js?v=20260825-radar-provider-checkpoint1"></script>
  <script src="site-ui.js?v=20260825-radar-provider-checkpoint1"></script>
  <script src="auth.js?v=20260825-radar-provider-checkpoint1"></script>
  <script src="social.js?v=20260825-radar-provider-checkpoint1"></script>
  <script src="market-detail.js?v=20260825-radar-provider-checkpoint1"></script>
  <script src="market-comments.js?v=20260825-radar-provider-checkpoint1"></script>
</body>
</html>
