name: Calidad de Atinara

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Sintaxis y pruebas unitarias
    runs-on: ubuntu-latest
    env:
      ATINARA_EXTERNAL_AI_DISABLED: "1"
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6

      - name: Preparar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm

      - name: Preparar Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.1.14"

      - name: Instalar dependencias bloqueadas
        run: npm ci --ignore-scripts

      - name: Auditar dependencias
        run: npm audit --audit-level=high

      - name: Validar JavaScript y pruebas
        run: npm run validate

      - name: Comprobar Edge Functions sin llamadas externas
        run: npm run test:edge
