#:schema https://developers.openai.com/codex/config-schema.json

# Atinara: configuración Codex versionada a nivel de repositorio.
# No contiene modelo, proveedor, token, clave ni credencial.

# Codex puede trabajar con autonomía dentro del repositorio, pero cualquier
# escalado fuera del sandbox debe quedar sometido a aprobación humana.
approval_policy = "on-request"
approvals_reviewer = "user"
sandbox_mode = "workspace-write"

# Atinara depende de documentación y proveedores que cambian con frecuencia.
# La búsqueda web en vivo es de lectura y no sustituye las fuentes de verdad.
web_search = "live"

# AGENTS.md raíz y las instrucciones anidadas caben por debajo de este límite.
# Mantenerlo explícito evita truncados silenciosos si las guías crecen.
project_doc_max_bytes = 32768

[sandbox_workspace_write]
# Los comandos del sandbox no reciben red saliente por defecto. Las lecturas
# externas deben usar web, apps o MCP autorizados, o solicitar escalado.
network_access = false

[apps._default]
# Las herramientas de apps pueden leer sin interrupción. Toda escritura pide
# aprobación a Yol, incluso cuando la app esté conectada.
default_tools_approval_mode = "writes"
approvals_reviewer = "user"

[agents]
# Por defecto, una orden de Yol se ejecuta en un único hilo principal.
# Desactivar multiagente evita que una sola tarea genere subagentes y consumo paralelo.
enabled = false
# Defensa adicional si Yol autoriza reactivar multiagente para una tarea excepcional.
# Este límite excluye el hilo principal.
max_concurrent_threads_per_session = 1
interrupt_message = true
